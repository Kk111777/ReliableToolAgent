name: Python tests

on:
  pull_request:
  push:
    branches:
      - ci-*

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    env:
      UV_HTTP_TIMEOUT: 600 # max 10min to install deps

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v6.0.3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup uv
        run: |
          python -m pip install uv==0.12.23
          uv venv .venv --python "${{ matrix.python-version }}"

      # Install dependencies
      - name: Install dependencies
        run: |
          # Reject legacy tokenizers source builds unsupported by the CI toolchain.
          uv pip install --python .venv/bin/python --only-binary tokenizers "smolagents[test] @ ."

      # Run tests
      - name: Test with pytest
        run: |
          # MCP fixtures launch Python subprocesses by name.
          source .venv/bin/activate
          .venv/bin/python -m pytest ./tests/
