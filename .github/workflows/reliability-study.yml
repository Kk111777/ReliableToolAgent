name: Reliability study checks

on:
  pull_request:
    paths:
      - "src/smolagents/**"
      - "local_demo/**"
      - "benchmark/tau3/**"
      - "reports/**"
      - "scripts/**"
      - "README*"
      - "docs/reproduction*"
      - "docs/budgeted_execution*"
      - "docs/study_results*"
      - ".github/workflows/reliability-study.yml"
  push:
    branches: [main]
    paths:
      - "local_demo/**"
      - "benchmark/tau3/**"
      - "reports/**"
      - "scripts/**"
      - ".github/workflows/reliability-study.yml"

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Install project and offline check dependencies
        run: pip install -e . pytest==9.1.1 httpx==0.28.1 markdown-it-py==4.2.0 ruff==0.16.8
      - name: Test runtime and study protocol without model credentials
        run: python -m pytest -q local_demo benchmark/tau3/tests
      - name: Check public evidence and protocol fragments
        run: |
          python scripts/audit_packaging_evidence.py
          python benchmark/tau3/scripts/audit_frozen_study.py
          python scripts/check_markdown_links.py
          python scripts/check_markdown_links.py benchmark/tau3/studies/retail-holdout-v1/README.md benchmark/tau3/studies/retail-holdout-v1/README.zh-CN.md benchmark/tau3/studies/retail-replication-v1/README.md benchmark/tau3/studies/retail-replication-v1/README.zh-CN.md docs/budgeted_execution.md docs/budgeted_execution.zh-CN.md docs/study_results.md docs/study_results.zh-CN.md 开始这里.md
      - name: Check study code style
        run: |
          ruff check benchmark/tau3/scripts/frozen_study.py benchmark/tau3/scripts/study_worker.py benchmark/tau3/scripts/run_frozen_study.py benchmark/tau3/scripts/analyze_frozen_study.py benchmark/tau3/scripts/audit_frozen_study.py benchmark/tau3/scripts/prepare_frozen_replay.py benchmark/tau3/scripts/extend_retail_design.py benchmark/tau3/scripts/analyze_replication.py benchmark/tau3/scripts/finish_retail_studies.py benchmark/tau3/scripts/study_evidence.py benchmark/tau3/scripts/run_budgeted_study.py benchmark/tau3/scripts/report_study_evidence.py benchmark/tau3/scripts/audit_study_cases.py benchmark/tau3/tests
          ruff format --check benchmark/tau3/scripts/frozen_study.py benchmark/tau3/scripts/study_worker.py benchmark/tau3/scripts/run_frozen_study.py benchmark/tau3/scripts/analyze_frozen_study.py benchmark/tau3/scripts/audit_frozen_study.py benchmark/tau3/scripts/prepare_frozen_replay.py benchmark/tau3/scripts/extend_retail_design.py benchmark/tau3/scripts/analyze_replication.py benchmark/tau3/scripts/finish_retail_studies.py benchmark/tau3/scripts/study_evidence.py benchmark/tau3/scripts/run_budgeted_study.py benchmark/tau3/scripts/report_study_evidence.py benchmark/tau3/scripts/audit_study_cases.py benchmark/tau3/tests
      - name: Recompute released cohort and case counters
        run: |
          python benchmark/tau3/scripts/study_evidence.py audit --input reports/frozen_study/retail-holdout-v1/public_evidence.json
          python benchmark/tau3/scripts/audit_study_cases.py --evidence reports/frozen_study/retail-holdout-v1/public_evidence.json --cases reports/frozen_study/retail-holdout-v1/case_index.json
          result_dir=$(mktemp -d)
          python benchmark/tau3/scripts/report_study_evidence.py --input reports/frozen_study/retail-holdout-v1/public_evidence.json --output "$result_dir/report"
          for name in summary.json report.md report.zh-CN.md; do
            cmp "reports/frozen_study/retail-holdout-v1/$name" "$result_dir/report/$name"
          done
          python scripts/check_markdown_links.py reports/frozen_study/retail-holdout-v1/README.md reports/frozen_study/retail-holdout-v1/README.zh-CN.md reports/frozen_study/retail-holdout-v1/report.md reports/frozen_study/retail-holdout-v1/report.zh-CN.md reports/frozen_study/retail-holdout-v1/cases.md reports/frozen_study/retail-holdout-v1/cases.zh-CN.md
